# move_base — 频率/耐心参照 YaLong move_base_tr.launch
shutdown_costmaps: false
controller_frequency: 10.0
controller_patience: 5.0
# 与 global_costmap.update_frequency=1.0 对齐，避免 10Hz 空转重规划导致路径微抖
planner_frequency: 1.0
planner_patience: 5.0
oscillation_timeout: 10.0
oscillation_distance: 0.2

# 开启恢复清图；窄通道关闭原地旋转，避免近终点乱转把 AMCL 转散
recovery_behavior_enabled: true
clearing_rotation_allowed: false

transform_tolerance: 0.5

# 下列速度项主要给非 TEB 规划器；TEB 以 teb_local_planner_params.yaml 为准
max_vel_x: 0.3
min_vel_x: 0.0
max_vel_y: 0.3
min_vel_y: -0.3
max_vel_theta: 0.8
min_vel_theta: -0.8
min_in_place_vel_theta: 0.2
acc_lim_x: 0.4
acc_lim_y: 0.5
acc_lim_theta: 0.8
