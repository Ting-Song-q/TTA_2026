# DWALocalPlanner parameters (use when local_planner:=dwa).
DWAPlannerROS:
    # Robot configuration
    max_vel_x: 0.5
    min_vel_x: 0.1
    max_vel_y: 0.3
    min_vel_y: -0.3
    max_vel_trans: 0.5
    min_vel_trans: 0.1
    max_vel_theta: 0.5
    min_vel_theta: -0.5

    acc_lim_x: 0.5
    acc_lim_y: 0.5
    acc_lim_theta: 1.0

    holonomic_robot: true

    # Goal tolerance
    yaw_goal_tolerance: 0.05
    xy_goal_tolerance: 0.05
    latch_xy_goal_tolerance: false

    # Forward simulation
    sim_time: 2.0
    vx_samples: 6
    vy_samples: 10
    vtheta_samples: 20
    sim_granularity: 0.05
    controller_frequency: 10.0

    # Trajectory scoring
    path_distance_bias: 32.0
    goal_distance_bias: 24.0
    occdist_scale: 0.01
    forward_point_distance: 0.325
    stop_time_buffer: 0.2
    scaling_speed: 0.25
    max_scaling_factor: 0.2

    # Oscillation prevention
    oscillation_reset_dist: 0.05

    # Pruning
    prune_plan: false
