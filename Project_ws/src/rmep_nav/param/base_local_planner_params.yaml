# TrajectoryPlannerROS parameters (legacy, used when local_planner:=base).
# Kept for backward compatibility with the original rmep_nav launch.
TrajectoryPlannerROS:
    max_vel_x: 0.5
    min_vel_x: 0.1
    max_vel_y: 0.3
    min_vel_y: -0.3
    max_vel_theta: 0.5
    min_vel_theta: -0.5
    min_in_place_vel_theta: 0.2

    acc_lim_x: 0.5
    acc_lim_y: 0.5
    acc_lim_theta: 1.0

    holonomic_robot: true
    yaw_goal_tolerance: 0.05
    xy_goal_tolerance: 0.05

    sim_time: 1.0
    vx_samples: 6
    vtheta_samples: 20
    sim_granularity: 0.05
