# nav_open_2026 参数配置（转速 × 时间纯开环）
# 配套脚本: main/nav_open_2026.py
# 依赖模块: 上一级目录 laser_avoidance.py / rescue_protocol.py
#
# 【你主要改这两类】
#   1) timed.speed / timed.turn_speed  —— 平移速度、旋转角速度
#   2) segment_motion.*.duration_*    —— 每一段跑多久（秒）
#
# 运动模型（手动时间模式）:
#   平移：以 speed 发 /cmd_vel，持续 duration_x / duration_y 秒
#   旋转：以 turn_speed 发角速度，持续 duration_turn 秒
# 方向由 zones 航点差的正负决定；时间完全由你填，不再用 距离/速度 自动算。

# ---------------------------------------------------------------------------
# 全局速度（可被某一航段覆盖）
# ---------------------------------------------------------------------------
timed:
  # ★ 平移速度 m/s —— 自己设
  speed: 0.3
  # ★ 旋转角速度 rad/s —— 自己设
  turn_speed: 0.5
  # 控制环发布频率 (Hz)
  control_rate: 100
  cmd_vel_topic: "/cmd_vel"
  # 面朝目标时，小于该角度(rad)则跳过旋转（仅 auto 转角时用）
  yaw_skip_rad: 0.03
  # 平移/转向段之间短停顿 (s)
  segment_pause_sec: 0.30
  # 到点后停车等待 (s)
  arrive_pause_sec: 0.50

# ---------------------------------------------------------------------------
# ★ 各航段：速度(可选覆盖) + 时间(秒，必填/自设)
# duration_x / duration_y / duration_turn = 0 表示该轴不动作
# ---------------------------------------------------------------------------
segment_motion:
  # parking → pickup
  to_pickup:
    speed: 0.3
    duration_x: 3.8
    duration_y: 0.0
    turn_speed: 0.5
    duration_turn: 0.0

  # pickup → loading
  to_loading:
    speed: 0.3
    duration_x: 7.4      # ★ 自己设
    duration_y: 0.0
    turn_speed: 0.5
    duration_turn: 6.28   # ★ 自己设（约转 180°：π/0.5）

  # 去救援区前后退（车体 -X）
  pre_rescue_backoff:
    speed: 0.3
    duration_x: 0.17      # ★ 自己设（约后退 5cm）
    duration_y: 0.0
    duration_turn: 0.0

  # loading → rescue_1
  to_rescue_1:
    speed: 0.3
    duration_x: 1.50      # ★ 自己设
    duration_y: 10.7
    turn_speed: 0.5
    duration_turn: 3.14

  to_rescue_2:
    speed: 0.3
    duration_x: 8.5
    duration_y: 10.5
    turn_speed: 0.5
    duration_turn: 3.14

  to_rescue_3:
    speed: 0.3
    duration_x: 9.00
    duration_y: 10.0
    turn_speed: 0.5
    duration_turn: 3.14

  to_rescue_4:
    speed: 0.3
    duration_x: 1.50
    duration_y: 11.2
    turn_speed: 0.5
    duration_turn: 3.14

  # rescue_N → parking（不同救援点返回参数各自独立，★ 自己设）
  to_parking_1:
    speed: 0.3
    duration_x: 11.00
    duration_y: 4.00
    turn_speed: 0.5
    duration_turn: 3.14

  to_parking_2:
    speed: 0.3
    duration_x: 10.80
    duration_y: 5.00
    turn_speed: 0.5
    duration_turn: 3.14

  to_parking_3:
    speed: 0.3
    duration_x: 10.00
    duration_y: 5.50
    turn_speed: 0.5
    duration_turn: 3.14

  to_parking_4:
    speed: 0.3
    duration_x: 11.5
    duration_y: 4.00
    turn_speed: 0.5
    duration_turn: 3.14

# ---------------------------------------------------------------------------
# 任务节拍（停顿时间，秒）—— 也由你设
# ---------------------------------------------------------------------------
mission:
  pickup_hold_sec: 3.0
  skip_drone_loading_hold_sec: 3.0
  skip_drone_unload_hold_sec: 3.0
  loading_hold_sec: 3.0
  unload_hold_sec: 3.0
  # 是否启用前往救援区前的后退段（已关闭）
  pre_rescue_backoff_enable: false

# ---------------------------------------------------------------------------
# 取货区：调用同目录 grasp/mobile_grasp.py（tta_root 默认即本 main/）
#   流程：臂 grasp 观察位 → 前进 → 横移视觉对位 → 再前进 → 腕部相机抓取
#         → 按进入距离后退 → 臂 final 位
#   详细参数在 grasp/configs/mobile_grasp.yaml；此处只配置如何启动。
# ---------------------------------------------------------------------------
mobile_grasp:
  enable: true
  # 含 grasp/ 与 arm/ 的目录；空则优先用本脚本所在 main/
  tta_root: ""
  script: grasp/mobile_grasp.py
  config: grasp/configs/mobile_grasp.yaml
  # 取货子进程解释器：必须能 import lerobot（不要用系统 /usr/bin/python3）
  # 推荐（自动找 conda 环境 lerobot）:
  #   python: auto
  # 或显式:
  #   python: conda:lerobot
  #   python: /home/tta/miniconda3/envs/lerobot/bin/python
  # 底盘 cmd_vel 仍由 mobile_grasp.yaml 的 ros_python=/usr/bin/python3 负责
  python: auto
  # 子进程最长等待 (s)；0 表示不限制
  timeout_sec: 300
  # 取货失败是否中止整段任务
  abort_on_fail: true

# ---------------------------------------------------------------------------
# 抓取结束后：重新握手机械臂舵机（mobile_grasp 会断开串口）
#   脚本: arm/reconnect_bus.py（connect_with_retry，不断力矩）
# ---------------------------------------------------------------------------
arm_reconnect:
  enable: true
  tta_root: ""
  script: arm/reconnect_bus.py
  og_config: arm/reset_and_grasp.yaml
  # 空则复用 mobile_grasp.python
  python: ""
  # 缺夹爪 id=6 时降级握手 1–5，避免任务卡死（放置前仍建议断电复位夹爪）
  allow_missing_gripper: true
  connect_max_attempts: 4
  connect_retry_s: 1.0
  hold_s: 0.3
  timeout_sec: 60
  # 重连失败默认不中止（抓取已成功时可继续去装货区）
  abort_on_fail: false

# ---------------------------------------------------------------------------
# 装货区：调用同目录 arm/place_apriltag.py
#   流程：放置观察位持块 → AprilTag 粗接近 → 视觉伺服 → 下降开爪 → 回 initial
#   详细参数在 arm/place_apriltag.yaml 与 arm/reset_and_grasp.yaml
#   未识别 Tag：前几次 --keep-hold-on-no-tag 前移重试；
#   最后一次仍无 Tag → 开爪+回初始位 exit=0，导航继续
# ---------------------------------------------------------------------------
place_apriltag:
  enable: true
  # 空则复用 mobile_grasp.tta_root / 自动查找本 main/
  tta_root: ""
  script: arm/place_apriltag.py
  og_config: arm/reset_and_grasp.yaml
  vision_config: arm/place_apriltag.yaml
  # 空则复用 mobile_grasp.python（推荐 auto / conda:lerobot）
  python: ""
  # 车载无显示器时建议 true，避免 OpenCV 窗口阻塞
  no_live_preview: true
  # 额外 CLI，例如: ["--place-descend-m", "0.03"]
  extra_args: []
  timeout_sec: 300
  abort_on_fail: true
  # 观察位看不到 AprilTag 时：前移距离 (m) 与额外重试次数
  no_tag_forward_m: 0.05
  no_tag_retries: 2
  # 空则用 timed.speed
  no_tag_forward_speed: ""

# ---------------------------------------------------------------------------
# 出发前雷达判障（前/后净空 < check_distance）
#   - 前方有障：pickup「左移 → 正常前进 → 右移」；
#              loading「左移 → 正常（含约180°转）→ 再左移」
#              （掉头后车体左右对调，第二次仍发左移才相当于场地回正）
#   - 仅后方有障：pickup 直行；loading「左移 → 正常 → 再左移」
#   - 前后都有：按前方处理
#   - 装货→救援：横移方向净空 < rescue_lateral_check_distance 时
#              「后退 rescue_lateral_backoff_m → 横移 → 前进同距 → 再 X/转向」
# ---------------------------------------------------------------------------
obstacle_sidestep:
  enable: true
  scan_topic: "/scan"
  # 等待首帧激光超时 (s)；超时则视为无障碍并继续
  scan_wait_timeout: 3.0
  # 车体前/后净空阈值 (m)
  check_distance: 0.6
  # 前方障碍侧移距离 (m)：任务语义「左/右」（实车 y 在 go_lateral_y 中已取反）
  lateral_distance: 0.5
  # 仅后方障碍时装货段侧移距离 (m)，两次均为任务语义「左」
  rear_loading_lateral_distance: 0.4
  # 侧移速度 (m/s)；缺省用 timed.speed
  lateral_speed: 0.3
  # 装货→救援：是否启用横移方向判障
  rescue_lateral_check_enable: true
  # 横移方向净空阈值 (m)；缺省同 check_distance
  rescue_lateral_check_distance: 0.6
  # 横移有障时：先后退、横移后再前进的距离 (m)
  rescue_lateral_backoff_m: 0.6
  # 雷达安装：rear 与 rmep_base / mission_config 一致（0°=车尾）
  lidar_mount: rear
  lidar_to_body:
    front: 0.30
    back: 0.20
    left: 0.25
    right: 0.25
  sector_half_width: 25
  side_sector_half_width: 55
  self_hit_margin: 0.03

# ---------------------------------------------------------------------------
# 航点：只决定“往哪边走”（正负方向）；走多久看上面 segment_motion
# PyYAML 请写 "y"，不要写裸键 y
# ---------------------------------------------------------------------------
zones:
  parking: {x: 0.0, "y": 0.0, yaw: 0.0}
  pickup:  {x: 0.28, "y": 0.0, yaw: 0.0}
  loading: {x: -0.23, "y": 0.0, yaw: 3.14}
  rescue:
    1: {x: -0.38, "y": 0.65, yaw: 1.57}
    2: {x: 0.45, "y": 0.70, yaw: 1.57}
    3: {x: 0.40, "y": -0.68, yaw: -1.57}
    4: {x: -0.38, "y": -0.75, yaw: -1.57}

# ---------------------------------------------------------------------------
# 无人机通讯（仅非 --skip-drone）
# ---------------------------------------------------------------------------
comm:
  drone_host: "192.168.10.66"
  drone_user: "forlinx"
  drone_password: "forlinx"
  rescue_target_path: "/mnt/rescue_target.flag"
  loading_done_path: "/mnt/loading_done.flag"
  delivery_done_path: "/mnt/delivery_done.flag"
  unload_done_path: "/mnt/unload_done.flag"

timeouts:
  wait_drone_cmd: 600
  delivery: 600
