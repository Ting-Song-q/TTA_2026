# SO-101 wrist-camera red-block grasp -> hollow red-frame placement.
# Every pose below is a CALIBRATION PLACEHOLDER.  Teach it on the real aircraft
# fixture before setting motion_enabled to true.  The pose pairs approach/down
# must hold the same horizontal location and end-effector orientation, with only
# a safe downward movement between them.
motion_enabled: true
release_torque_on_exit: false
port: /dev/serial/by-id/usb-1a86_USB_Single_Serial_5B61032896-if00
baud: 1000000
gripper_open: 1200
gripper_close: 800

camera:
  index_or_path: /dev/video11
  width: 640
  height: 480
  settle_frames: 4

output_dir: output/grasp_put

motion:
  step_ticks: 35
  step_s: 0.06
  settle_s: 0.35
  stage_settle_s: 0.45
  arrive_tol_ticks: 10
  hold_hz: 10
  joint_limits:
    shoulder_pan: [600, 3400]
    shoulder_lift: [600, 3400]
    elbow_flex: [600, 3400]
    wrist_flex: [600, 3400]
    wrist_roll: [600, 3400]
    gripper: [600, 2400]
  route_points: 5
  ik_tol_m: 0.012
  max_horiz_m: 0.28
  approach_clearance_m: 0.06
  waypoint_s: 0.05
  close_settle_s: 0.8
  open_settle_s: 0.8

intrinsics: output/camera_calib/camera_intrinsics.yaml
handeye: output/handeye_ee_cam.yaml
scene:
  table_z_m: 0.25
  place_z_m: 0.18
  table_normal: [0.0, 0.0, 1.0]

# Only these four anchor poses need to be taught.  Target-dependent approach,
# descent, grasp, lift and placement are generated by the SO101 IK at runtime.
poses:
  grasp_observe: 
    shoulder_pan: 2033
    shoulder_lift: 1997
    elbow_flex: 1482
    wrist_flex: 3201
    wrist_roll: 1989
    gripper: 805
    
  grasp_reset:   
    shoulder_pan: 1978
    shoulder_lift: 799
    elbow_flex: 2358
    wrist_flex: 3058
    wrist_roll: 1986
    gripper: 920

  place_observe: 
    shoulder_pan: 1978
    shoulder_lift: 1493
    elbow_flex: 1720
    wrist_flex: 3340
    wrist_roll: 1987
    gripper: 921

  safe:
    shoulder_pan: 1978
    shoulder_lift: 799
    elbow_flex: 2358
    wrist_flex: 3058
    wrist_roll: 1986
    gripper: 920  

grasp:
  target_px: [320, 265]
  deadband_px: [22, 22]
  stable_frames: 3
  max_iters: 12
  loop_s: 0.25
  close_settle_s: 0.8
  # Determine signs by moving one joint a few ticks at the grasp observe pose.
  correction_ticks_per_px: {shoulder_pan: 0.0, shoulder_lift: 0.0, elbow_flex: 0.0}
  detector:
    roi: [0.08, 0.12, 0.92, 0.92]
    min_area: 500
    kernel: 3

place:
  target_px: [320, 250]
  deadband_px: [24, 24]
  stable_frames: 3
  max_iters: 15
  loop_s: 0.25
  open_settle_s: 0.8
  # Determine signs/gains independently: placement observation normally differs
  # from grasp observation and the held block may change the view.
  correction_ticks_per_px: {shoulder_pan: 0.0, shoulder_lift: 0.0, elbow_flex: 0.0}
  detector:
    roi: [0.05, 0.10, 0.95, 0.78]
    min_area: 700
    min_hole_ratio: 0.10
    kernel: 3
