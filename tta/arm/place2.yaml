# place2.py 专用：红色镂空框放置（与 reset_and_grasp.yaml 合并）

poses:
  place_observe:
    shoulder_pan: 1944
    shoulder_lift: 1891
    elbow_flex: 1720
    wrist_flex: 3007
    wrist_roll: 1981
    gripper: 910

  # 开爪前：夹爪与地面平行
  place_parallel:
    shoulder_pan: 1987
    shoulder_lift: 2647
    elbow_flex: 1919
    wrist_flex: 1670
    wrist_roll: 1983

grasp:
  # 开环前伸（无 Tag 深度时用相机光轴方向）
  forward_m: 0.080
  z_offset_m: 0.000
  left_m: 0.000
  route_points: 4
  final_forward_probe_m: 0.025
  final_forward_route_points: 3
  place_max_z_drop_m: 0.012
  place_lock_wrist: true
  # 实时伺服锁肘易导致原地踏步；朝前只锁腕即可
  place_lock_elbow: false
  place_max_lift_delta_ticks: 200
  # 腕相机前伸后水平半径常 >280mm，放宽以免伺服整步跳过
  max_horiz_m: 0.34

  # 视觉伺服目标（参考 test2 x_center/y_center）
  preclose_target_u_px: 320
  preclose_target_v_px: 280
  preclose_tol_u_px: 28
  preclose_tol_v_px: 32
  preclose_m_per_px: 0.00022
  preclose_max_step_m: 0.020
  preclose_iters: 8
  place_live_loop_s: 0.08
  place_live_timeout_s: 45.0
  place_stable_frames: 3
  place_live_preview: false
  place_live_save_every: 5

  # 已配置 place_parallel 时默认不再笛卡尔下降
  place_descend_m: 0.0
  place_descend_route_points: 4
  # 开爪前：先 wrist_flex，再 shoulder_lift（分两步）
  pre_open_wrist_flex_delta: -500
  pre_open_shoulder_lift_delta: 300

