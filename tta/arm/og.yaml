# SO-101：初始位 → 观察位 → 识别红块 → IK 抓取 → 保持
# python3 og.py --yes

port: /dev/serial/by-id/usb-1a86_USB_Single_Serial_5B61032896-if00
baud: 1000000

# 基座系场景（米）
scene:
  table_z_m: 0.25
  table_normal: [0.0, 0.0, 1.0]
  block_size_m: [0.03, 0.03, 0.03]
  grasp_height_mode: center

intrinsics: output/camera_calib/camera_intrinsics.yaml
handeye: output/handeye_ee_cam.yaml

motion:
  step_ticks: 40
  step_s: 0.06
  settle_s: 0.4
  hold_hz: 10.0
  arrive_tol_ticks: 8
  joint_limits:
    shoulder_pan: [600, 3400]
    shoulder_lift: [600, 3400]
    elbow_flex: [600, 3400]
    wrist_flex: [600, 3400]
    wrist_roll: [600, 3400]
    gripper: [600, 2400]

camera:
  index_or_path: /dev/video11
  width: 640
  height: 480
  fps: 30
  settle_frames: 8
  frame_timeout_s: 5.0

grasp3d:
  gripper_open: 1200
  gripper_close: 2100
  approach_z_m: 0.08
  ee_z_offset_m: 0.04
  ik_tol_m: 0.012
  max_horiz_m: 0.28
  close_settle_s: 0.85

detector:
  roi: [0.08, 0.15, 0.92, 0.92]
  red_hsv:
    lower1: [0, 75, 45]
    upper1: [18, 255, 255]
    lower2: [165, 75, 45]
    upper2: [180, 255, 255]
  red_rgb:
    min_r: 95
    min_r_minus_g: 28
    min_r_minus_b: 22
    max_g: 205
  min_area: 500
  min_rect_fill: 0.40
  aspect_ratio_range: [0.35, 2.80]
  open_kernel: 3
  close_kernel: 5

poses:
  initial:
    shoulder_pan: 2052
    shoulder_lift: 963
    elbow_flex: 2057
    wrist_flex: 3137
    wrist_roll: 2104
    gripper: 1300

  # 观察位（看红块）
  grasp:
    shoulder_pan: 2053
    shoulder_lift: 1846
    elbow_flex: 1279
    wrist_flex: 3325
    wrist_roll: 2003
    gripper: 1262
